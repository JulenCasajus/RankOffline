name: Build signed release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RANKOFFLINE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rankoffline-release.jks"
          echo "RANKOFFLINE_UPLOAD_STORE_FILE=$RUNNER_TEMP/rankoffline-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          RANKOFFLINE_UPLOAD_STORE_PASSWORD: ${{ secrets.RANKOFFLINE_KEYSTORE_PASSWORD }}
          RANKOFFLINE_UPLOAD_KEY_ALIAS: ${{ secrets.RANKOFFLINE_KEY_ALIAS }}
          RANKOFFLINE_UPLOAD_KEY_PASSWORD: ${{ secrets.RANKOFFLINE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RANKOFFLINE_UPLOAD_STORE_PASSWORD"
          test -n "$RANKOFFLINE_UPLOAD_KEY_ALIAS"
          test -n "$RANKOFFLINE_UPLOAD_KEY_PASSWORD"
          ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache
          test -f app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rankoffline-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
